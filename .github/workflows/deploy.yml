name: Deploy

# After CI passes on main:
#   1. Apply the Prisma schema to the production Neon database
#      (additive fields only; never drops data).
#   2. Deploy to Vercel (production).
#   3. Smoke-test the live deployment's /api/health.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   PROD_DATABASE_URL  — Neon POOLED connection string (app runtime)
#   PROD_DIRECT_URL    — Neon DIRECT connection string (schema changes)
#   VERCEL_TOKEN       — Vercel access token (vercel.com → account settings → tokens)
#   VERCEL_ORG_ID      — Vercel org id (from `vercel link` or project settings)
#   VERCEL_PROJECT_ID  — Vercel project id
#
# If any are missing the corresponding step is skipped with a notice, so the
# pipeline still shows green until the secrets are added.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Schema → Vercel → Smoke test
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      PROD_DATABASE_URL_SET: ${{ secrets.PROD_DATABASE_URL != '' && secrets.PROD_DIRECT_URL != '' }}
      VERCEL_SET: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema to production database
        if: ${{ env.PROD_DATABASE_URL_SET == 'true' }}
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Verify production database health
        if: ${{ env.PROD_DATABASE_URL_SET == 'true' }}
        run: node scripts/db-health.js
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Deploy to Vercel (production)
        if: ${{ env.VERCEL_SET == 'true' }}
        id: vercel
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          URL=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke test live deployment
        if: ${{ env.VERCEL_SET == 'true' }}
        run: |
          URL="${{ steps.vercel.outputs.url }}"
          echo "Smoke testing $URL/api/health"
          for i in $(seq 1 15); do
            if curl -sf "$URL/api/health" | tee /tmp/health.json | grep -q '"status":"ok"'; then
              echo "Live deployment healthy:"
              cat /tmp/health.json
              exit 0
            fi
            sleep 4
          done
          echo "Deployment failed the /api/health smoke test"
          exit 1

      - name: Secrets missing — skipped steps notice
        if: ${{ env.VERCEL_SET != 'true' }}
        run: |
          echo "::notice::Deployment skipped — add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (and PROD_DATABASE_URL / PROD_DIRECT_URL for schema sync) as repository secrets. See .github/workflows/deploy.yml header."
